name: deploy

# The catalogue is read-only, so it is generated and served as files. The
# autobuilder does not have to know this repository exists: the schedule picks
# up whatever status file it published last, and a dispatch makes it immediate.

on:
  workflow_dispatch:
  repository_dispatch:
    types: [status_updated]
  push:
    branches: [main]
  # The autobuilder does not know this repository exists: it publishes a
  # status file and this picks it up. Half an hour is the longest the site can
  # lag behind a build, and a run with nothing new to say costs a minute.
  schedule:
    - cron: '*/30 * * * *'

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      generated: ${{ steps.generate.outputs.generated }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run the tests
        run: python3 -m unittest discover -t . -s tests

      - name: Generate the catalogue
        id: generate
        shell: bash
        run: |
          set +e
          python3 -m vitasdk_web.generate --status vitasdk/vitasdk-autobuild --output _site
          status=$?
          set -e
          # 2 means the autobuilder has not published a status file yet, which
          # is the normal state until its first run and not a broken site.
          if [[ $status -eq 2 ]]; then
            echo 'generated=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'generated=true' >> "$GITHUB_OUTPUT"
          exit $status

      - uses: actions/upload-pages-artifact@v5
        if: steps.generate.outputs.generated == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.generated == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
